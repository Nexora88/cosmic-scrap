name: iOS Simulator Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E "Xcode 26\\."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@8.6.2 @capacitor/ios@8.6.2 @capacitor/cli@8.6.2 @capacitor/assets@4.0.0 sharp@0.35.5

      - name: Run project tests
        run: npm test

      - name: Stage web assets and add iOS project
        run: |
          node scripts/build-native.mjs
          npx cap add ios
          npx @capacitor/assets generate --ios --assetPath assets --iconBackgroundColor '#050811' --iconBackgroundColorDark '#050811' --splashBackgroundColor '#050811' --splashBackgroundColorDark '#050811'
          npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build simulator app
        run: |
          xcodebuild \\
            -project ios/App/App.xcodeproj \\
            -scheme App \\
            -sdk iphonesimulator \\
            -configuration Debug \\
            -destination 'generic/platform=iOS Simulator' \\
            -derivedDataPath ios/build \\
            CODE_SIGNING_ALLOWED=NO \\
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: taviro-ios-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
