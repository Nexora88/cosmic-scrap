name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Capacitor build tools
        run: npm install --no-save --package-lock=false @capacitor/core@8.6.2 @capacitor/android@8.6.2 @capacitor/cli@8.6.2 @capacitor/assets@4.0.0 sharp@0.35.5

      - name: Run project tests
        run: npm test

      - name: Stage web assets and add Android project
        run: |
          node scripts/build-native.mjs
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#050811' --iconBackgroundColorDark '#050811' --splashBackgroundColor '#050811' --splashBackgroundColorDark '#050811'
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taviro-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
