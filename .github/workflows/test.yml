name: Test Cosmic Scrap

on:
  push:
    branches: [main, feature/account-coop-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic regression tests
        run: npm test
      - name: Check main entry syntax
        run: npm run check
