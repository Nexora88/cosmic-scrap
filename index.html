<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cosmic Scrap</title>
<link rel="stylesheet" href="css/joystick-fix.css">
</head><body style="margin:0;background:#000;color:#9cf;font:14px system-ui;display:grid;place-items:center;min-height:100dvh">
<p id="boot">Loading Cosmic Scrap…</p>
<script>
const B64="SEE_ARTIFACT";
(async()=>{
  try {
    const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
    const stream=new Response(bin).body.pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  } catch(e) {
    document.getElementById("boot").textContent="Load failed: "+e.message;
    console.error(e);
  }
})();
</script>
</body></html>
